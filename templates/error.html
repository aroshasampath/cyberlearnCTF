{% extends "base.html" %}

{% block title %}
{{ code }} | CyberLearn CTF
{% endblock %}

{% block content %}

<section class="error-page">

    <p class="error-code">
        {{ code }}
    </p>

    <h1>
        {{ title }}
    </h1>

    <p>
        {{ message }}
    </p>

    <a
        class="btn"
        href="{{ url_for('home') }}"
    >
        Return Home
    </a>

</section>

{% endblock %}
